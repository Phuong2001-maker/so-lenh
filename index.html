/* ==================================================================
   MÁY PHÂN TÍCH KHUNG GIỜ  (mọi hàm nhận engine E làm tham số đầu)
   - dòng tiền đã khớp (gộp 4 sàn, chuẩn hóa USD, dấu + = mua chủ động)
   - bộ theo dõi tường: tuổi, bài kiểm tra tiếp cận, xác nhận chéo sàn
   - funding + OI (OKX REST) + thanh lý (Binance) + biên 4h (nến 15m)
   - điểm tổng hợp 6 tín hiệu
   ================================================================== */
function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }
function bitCount(x){ let n = 0; while (x){ n += x & 1; x >>= 1; } return n; }

/* ⚠ CẮT MẢNG NGAY TẠI CHỖ NẠP, không đợi hàm đọc.
   Trước đây `flowSec` chỉ bị cắt bên trong `flowStats()` và `liqs` bên trong
   `liqStats()` — mà cả hai chỉ được gọi từ `analyze()`, và `analyze()` thoát ngay
   khi `aggregate()` trả null (mất hết sàn). Trong khi đó hai nguồn NẠP vẫn chảy độc
   lập với sức khoẻ sổ lệnh: socket thanh lý là socket dùng chung toàn sàn, còn
   socket thứ hai của Binance (aggTrade) sống riêng với socket depth. Kết quả là hai
   mảng này tăng KHÔNG GIỚI HẠN — với bot chạy nhiều ngày thì đây là đường rò rỉ bộ
   nhớ thật sự duy nhất trong cả kiến trúc (wallBook dọn 24h, lvlWatch 600s,
   oiHist chặn 240, hangDoi có trần).
   Trần cứng cuối cùng để một cú bùng nổ tick không nuốt hết RAM trước khi cắt theo
   thời gian kịp tác dụng. */
const TRAN_FLOW = 20000, TRAN_LIQ = 20000;

function pushTrade(E, n){
  if (!E || !E.flowSec || !isFinite(n)) return;
  const s = Math.floor(Date.now() / 1000);
  while (E.flowSec.length && s - E.flowSec[0].t > 7200) E.flowSec.shift();
  if (E.flowSec.length > TRAN_FLOW) E.flowSec.splice(0, E.flowSec.length - TRAN_FLOW);
  const last = E.flowSec[E.flowSec.length - 1];
  /* GIỮ RIÊNG mua và bán, không chỉ hiệu số: n=0 có thể là "chợ chết" (không ai
     giao dịch) hoặc "hai phe đánh nhau ngang cơ" — hai trạng thái hoàn toàn khác
     nhau mà bộ đếm có dấu cũ gộp làm một. Mất là mất vĩnh viễn, không backfill được. */
  const mua = n > 0 ? n : 0, ban = n < 0 ? -n : 0;
  if (last && last.t === s){ last.n += n; last.mua += mua; last.ban += ban; }
  else E.flowSec.push({t: s, n, mua, ban});
}
function pushLiq(E, side, n){
  /* Kiểm `E.liqs` chứ không chỉ `E`: ở chế độ xem, engine do napTrangThai() dựng
     không có mảng này. Lưới an toàn cho mọi đường gọi lạ trong tương lai. */
  if (!E || !E.liqs) return;
  const now = Date.now();
  while (E.liqs.length && now - E.liqs[0].t > 1800e3) E.liqs.shift();
  if (E.liqs.length > TRAN_LIQ) E.liqs.splice(0, E.liqs.length - TRAN_LIQ);
  E.liqs.push({t: now, side, n});
}

function flowStats(E){
  const now = Math.floor(Date.now() / 1000);
  while (E.flowSec.length && now - E.flowSec[0].t > 7200) E.flowSec.shift();
  let f5 = 0, f30 = 0, mua30 = 0, ban30 = 0;
  for (const x of E.flowSec){
    const age = now - x.t;
    if (age <= 300) f5 += x.n;
    if (age <= 1800){ f30 += x.n; mua30 += x.mua; ban30 += x.ban; }
  }
  return {f5, f30, mua30, ban30};
}
function liqStats(E){
  const now = Date.now();
  while (E.liqs.length && now - E.liqs[0].t > 1800e3) E.liqs.shift();
  let L = 0, S = 0;
  for (const x of E.liqs){
    if (now - x.t <= 300e3){ if (x.side === 'long') L += x.n; else S += x.n; }
  }
  return {L, S};
}

/* ---- bộ theo dõi tường (lọc lệnh ảo) — sống trong RAM theo từng coin ---- */
function wallKey(side, p){ return side + ':' + p.toPrecision(6); }
function updateWalls(E, A){
  if (!A) return;
  const wallBook = E.wallBook;
  const now = Date.now();
  /* ngưỡng "áp sát"/"rời xa" theo BƯỚC GIÁ — tự co giãn theo độ mịn của sổ
     (ngưỡng % cố định từng làm sổ dày như BTC bị chấm oan hàng loạt) */
  /* có trần % để coin sổ thưa (step bị thổi phồng bởi mốc rác xa) vẫn đo được "chịu chạm" */
  const nearD = Math.min(3 * A.step, 0.005 * A.mid);
  const leaveD = Math.min(8 * A.step, 0.012 * A.mid);
  const track = (rows, side) => {
    if (!rows.length) return;
    const th = 0.25 * Math.max(...rows.map(r => r.m));
    for (const r of rows){
      if (r.m < th) continue;
      const key = wallKey(side, r.p);
      const w = wallBook[key] || (wallBook[key] = {f: now, p: r.p, sv: 0, pl: 0, fl: 0, mx: 0, cx: 0});
      w.l = now; w.cur = r.m;
      w.mx = Math.max(w.mx, r.m);
      w.cx = Math.max(w.cx, bitCount(r.ex || 0));
      const dist = Math.abs(A.mid - r.p);
      if (dist <= nearD) w.near = true;
      else if (dist >= leaveD && w.near){
        w.near = false;
        if (w.cur > 0.5 * w.mx) w.sv++;   /* giá áp sát rồi rời đi mà tường còn → sống sót */
      }
    }
  };
  track(A.bids, 'b'); track(A.asks, 'a');
  /* tường biến mất khi giá đang áp sát: còn gần nguyên khối = RÚT (lệnh ảo);
     đã bị ăn mòn dần = lệnh THẬT vừa được khớp — không phạt, thưởng nhẹ */
  for (const key in wallBook){
    const w = wallBook[key];
    if (w.near && w.l && now - w.l > 4000){
      w.near = false;
      /* chỉ kết luận khi GIÁ VẪN Ở GẦN mốc đó — giá đã đi xa thì tường chỉ là xoay vòng, không phạt */
      const stillNear = w.p === undefined || Math.abs(A.mid - w.p) <= leaveD;
      if (stillNear){
        /* bước giá đổi làm bucket bị "đổi tên": nếu vùng giá đó VẪN còn ≥40% tiền
           thì tường không hề rút — xóa bản ghi cũ lặng lẽ, không phạt oan */
        let rekeyed = false;
        if (w.p !== undefined){
          const rows = key.charAt(0) === 'b' ? A.bids : A.asks;
          let zone = 0;
          for (const r of rows){ if (Math.abs(r.p - w.p) <= 1.5 * A.step) zone += r.m; }
          if (zone >= 0.4 * w.mx){ delete wallBook[key]; rekeyed = true; }
        }
        if (!rekeyed){
          const pulled = w.cur >= 0.6 * w.mx;
          if (pulled) w.pl++; else w.fl = (w.fl || 0) + 1;
        }
      }
    }
    if (wallBook[key] && w.l && now - w.l > 24 * 3600e3) delete wallBook[key];
  }
}
function wallTrust(E, side, p){
  const w = E.wallBook[wallKey(side, p)];
  if (!w) return 30;
  const ageMin = ((w.l || w.f) - w.f) / 60000;
  /* tường CHƯA từng bị giá thử (chưa chịu chạm, chưa bị khớp) thì "sống lâu"
     chỉ được cộng nửa điểm — treo lệnh ảo ở xa giá chẳng tốn gì */
  const tested = w.sv > 0 || (w.fl || 0) > 0;
  let s = 30 + Math.min(tested ? 30 : 15, ageMin * 1.5) + w.sv * 15 + (w.fl || 0) * 8
        - Math.min(w.pl, 3) * 30
        + (w.cx >= 2 ? 10 : 0) + (w.cx >= 3 ? 5 : 0);
  return clamp(Math.round(s), 0, 100);
}
function wallInfo(E, side, p){
  const w = E.wallBook[wallKey(side, p)];
  if (!w) return '';
  const age = Math.round(((w.l || w.f) - w.f) / 60000);
  let t = `sống ${age}'`;
  if (w.sv) t += ` · chịu ${w.sv} lần chạm`;
  if (w.fl) t += ` · ${w.fl} lần khớp thật`;
  if (w.pl) t += ` · ${w.pl} lần rút`;
  return t;
}

/* ---- funding / OI / biên 4h (OKX REST — CORS đã kiểm chứng) ---- */
async function pollMarket(E, g){
  const inst = E.sym + '-USDT-SWAP';
  try{
    /* CHỈ còn funding — open interest đã chuyển sang kênh WebSocket open-interest */
    const fr = await fetch('https://www.okx.com/api/v5/public/funding-rate?instId=' + inst).then(r => r.json());
    if (g !== E.gen) return;
    const market = E.market;
    if (fr.data && fr.data[0]){
      const fd = fr.data[0];
      const f = parseFloat(fd.fundingRate);
      /* chu kỳ funding KHÔNG phải sàn nào/coin nào cũng 8h — nhiều coin meme là 4h/2h/1h */
      let ivH = 8;
      const t0 = parseFloat(fd.prevFundingTime), t1 = parseFloat(fd.fundingTime), t2 = parseFloat(fd.nextFundingTime);
      if (isFinite(t1) && isFinite(t0) && t1 > t0) ivH = (t1 - t0) / 3600e3;
      else if (isFinite(t2) && isFinite(t1) && t2 > t1) ivH = (t2 - t1) / 3600e3;
      if (isFinite(f)){ market.funding = f; market.fundH = Math.round(ivH) || 8; }
    }
  }catch(e){}
}
async function pollCandles(E, g){
  try{
    const j = await fetch('https://www.okx.com/api/v5/market/candles?instId=' + E.sym + '-USDT-SWAP&bar=15m&limit=192').then(r => r.json());
    if (g !== E.gen || !j.data || j.data.length < 16) return;
    const D = j.data;   /* nến 15m, MỚI NHẤT trước (192 nến = 48h) */
    /* biên dao động điển hình (trung vị) của cửa sổ n nến */
    const med = n => {
      const rs = [];
      for (let i = 0; i + n <= D.length; i += Math.max(1, Math.floor(n / 2))){
        let hi = -Infinity, lo = Infinity;
        for (let k = i; k < i + n; k++){
          hi = Math.max(hi, parseFloat(D[k][2]));
          lo = Math.min(lo, parseFloat(D[k][3]));
        }
        if (lo > 0) rs.push((hi - lo) / lo);
      }
      rs.sort((a, b) => a - b);
      return rs.length ? rs[Math.floor(rs.length / 2)] : null;
    };
    E.market.ranges = {h1: med(4), h2: med(8), h4: med(16)};
    E.market.atr4h = E.market.ranges.h4;
    /* giá đóng cửa tham chiếu để tính % biến động 1h / 4h / 24h */
    const cl = i => (D[i] ? parseFloat(D[i][4]) : null);
    E.market.ref = {c1: cl(4), c4: cl(16), c24: cl(Math.min(96, D.length - 1))};
  }catch(e){}
}

/* ---- điểm tổng hợp + mục tiêu ---- */
/* chọn tối đa 3 tường mạnh nhất (tiền × tin) trong 15%, cách nhau ≥1.5% để không dính chùm */
function pickLevels(E, rows, side, mid, isBid){
  const cands = [];
  for (const r of rows){
    const d = isBid ? (mid - r.p) / mid : (r.p - mid) / mid;
    if (d <= 0.001 || d > 0.15) continue;
    const t = wallTrust(E, side, r.p);
    cands.push({p: r.p, m: r.m, trust: t, d, ex: r.ex, score: r.m * (t / 100)});
  }
  cands.sort((a, b) => b.score - a.score);
  const picked = [];
  for (const c of cands){
    if (picked.length >= 3) break;
    if (picked.some(x => Math.abs(x.p - c.p) / mid < 0.015)) continue;
    picked.push(c);
  }
  picked.sort((a, b) => a.d - b.d);
  return picked;
}

function bestWall(E, rows, side, mid, cap, isBid){
  let best = null, bs = 0;
  for (const r of rows){
    const d = isBid ? (mid - r.p) / mid : (r.p - mid) / mid;
    if (d <= 0 || d > cap) continue;
    const t = wallTrust(E, side, r.p);
    const score = r.m * (t / 100) * (t >= 55 ? 1 : 0.3);
    if (score > bs){ bs = score; best = {p: r.p, m: r.m, trust: t, ex: r.ex || 0, mGop: r.mGop || r.m}; }
  }
  return best;
}
function analyze(E, A){
  if (!A){ E.pred = {ready: false}; return; }
  const market = E.market, midHist = E.midHist;
  const mid = A.mid, now = Date.now();
  midHist.push({t: now, p: mid});
  while (midHist.length && now - midHist[0].t > 7200e3) midHist.shift();

  const {f5, f30, mua30, ban30} = flowStats(E);
  const {L, S: SL} = liqStats(E);
  const bookM = A.bids.reduce((s, r) => s + r.m, 0) + A.asks.reduce((s, r) => s + r.m, 0);
  const scale = Math.max(bookM, 1e5);

  const sFlow30 = clamp(f30 / (scale * 0.05), -1, 1);
  const sFlow5  = clamp(f5 / (scale * 0.015), -1, 1);

  let tb = 0, ta = 0;
  for (const r of A.bids){ if ((mid - r.p) / mid < 0.005) tb += r.m * wallTrust(E, 'b', r.p) / 100; }
  for (const r of A.asks){ if ((r.p - mid) / mid < 0.005) ta += r.m * wallTrust(E, 'a', r.p) / 100; }
  const sBook = (tb + ta) > 0 ? (tb - ta) / (tb + ta) : 0;

  let sOi = 0;
  /* lấy mẫu GẦN mốc 25 phút nhất (phần tử mới nhất mà đã cũ hơn 25') —
     find() từ đầu mảng từng lấy nhầm phần tử CŨ NHẤT (2-4 tiếng) làm lệch cả tín hiệu */
  const pick25 = arr => {
    for (let i = arr.length - 1; i >= 0; i--) if (now - arr[i].t > 25 * 60e3) return arr[i];
    return null;
  };
  let dP25 = null, dOi25 = null;
  if (market.oi && market.oiHist.length >= 3 && midHist.length >= 3){
    const o0 = pick25(market.oiHist);
    const p0 = pick25(midHist);
    if (o0 && p0 && o0.v > 0 && p0.p > 0){
      dOi25 = (market.oi - o0.v) / o0.v;
      dP25 = (mid - p0.p) / p0.p;
      if (Math.abs(dP25) > 0.001 && Math.abs(dOi25) > 0.002){
        const mag = Math.min(1, Math.abs(dOi25) / 0.02);
        if (dP25 > 0) sOi = dOi25 > 0 ? mag : -0.4 * mag;
        else sOi = dOi25 > 0 ? -mag : 0.4 * mag;
      }
    }
  }
  /* funding âm sâu = short đông nghẹt = nghiêng nguy cơ squeeze LÊN (ngược đám đông)
     — quy đổi về mức /8h vì chu kỳ funding mỗi coin mỗi khác (4h/2h/1h) */
  const f8 = (market.funding !== null && isFinite(market.funding))
    ? market.funding * (8 / (market.fundH || 8)) : null;
  const sFund = f8 !== null ? clamp(-f8 / 0.001, -1, 1) : 0;
  /* thanh lý long = bán cưỡng bức đẩy XUỐNG; thanh lý short đẩy LÊN
     — mẫu số có sàn tối thiểu $25k để một cú thanh lý vặt trên coin mỏng không ghim kim */
  const sLiq = clamp((SL - L) / Math.max(scale * 0.01, 25000), -1, 1);

  /* CHỈNH THEO SỐ LIỆU (log 79 kèo, 2026-07-14): dòng tiền kịch kim cả 2 khung
     thắng 54% vs 61% của tín hiệu vừa → giảm 20% trọng số flow khi bão hòa */
  const satPen = (Math.abs(sFlow30) >= 0.99 && Math.abs(sFlow5) >= 0.99) ? 0.8 : 1;
  const S = 100 * (0.30 * sFlow30 * satPen + 0.15 * sFlow5 * satPen + 0.15 * sBook + 0.10 * sOi + 0.10 * sFund + 0.20 * sLiq);
  /* dòng 5' ngược hẳn dòng 30' = thị trường đang đảo nhịp — mẫu này thua 60% (4/10) → đứng ngoài */
  const flowConflict = Math.sign(sFlow5) !== Math.sign(sFlow30)
    && Math.abs(sFlow5) > 0.3 && Math.abs(sFlow30) > 0.3;
  /* CHỈNH #2 (gộp 3 vòng log: bão hòa 50% vs vừa 62%): dòng tiền kịch kim cả 2 khung
     mà KHÔNG có sổ lệnh hoặc OI xác nhận cùng chiều → nghi đuổi đuôi cú chạy, đứng ngoài */
  const satNoConfirm = satPen < 1
    && !((sBook * Math.sign(S) >= 0.2) || (sOi * Math.sign(S) >= 0.2));
  const parts = [sFlow30, sFlow5, sBook, sOi, sFund, sLiq];
  const act = parts.filter(x => Math.abs(x) > 0.15);
  const agree = act.length ? act.filter(x => Math.sign(x) === Math.sign(S)).length / act.length : 0;
  const conf = Math.round(clamp(38 + Math.abs(S) * 0.32 + agree * 22, 0, 80));

  /* khung tự chọn theo độ nóng: coin chạy ≥3%/cửa sổ thì lấy cửa sổ ngắn nhất đủ nóng */
  let frameH = 4, cap = market.atr4h || 0.03;
  const R = market.ranges;
  if (R && R.h1 !== null){
    if (R.h1 >= 0.03){ frameH = 1; cap = R.h1; }
    else if (R.h2 >= 0.03){ frameH = 2; cap = R.h2; }
    else if (R.h4){ frameH = 4; cap = R.h4; }
  }
  /* GIÁ VÀO / GIÁ CHỐT lấy từ SỔ RIÊNG OKX — đó là nơi lệnh thật sẽ khớp.
     Tường chỉ tồn tại ở sàn khác thì trên OKX giá đi xuyên qua như không có gì. */
  const sup = bestWall(E, A.bidsOkx, 'b', mid, cap, true);
  const res = bestWall(E, A.asksOkx, 'a', mid, cap, false);

  /* ETA: tiền (đã lọc tin cậy) chắn giữa giá và mục tiêu ÷ tốc độ dòng tiền */
  let eta = null;
  const rate = Math.abs(f30) / 30;
  if (rate > 0 && Math.abs(S) >= 25){
    const tgt = S < 0 ? sup : res;
    if (tgt && ((S < 0 && f30 < 0) || (S > 0 && f30 > 0))){
      let block = 0;
      const rows = S < 0 ? A.bidsOkx : A.asksOkx;
      for (const r of rows){
        const between = S < 0 ? (r.p >= tgt.p && r.p < mid) : (r.p <= tgt.p && r.p > mid);
        if (between) block += r.m * wallTrust(E, S < 0 ? 'b' : 'a', r.p) / 100;
      }
      eta = Math.round(block / rate);
    }
  }

  /* warmLeft: 90 giây đầu chưa đủ dòng tiền để lọc lệnh ảo → chưa phát tín hiệu */
  const warmLeft = Math.ceil((90000 - (now - E.engineStart)) / 1000);
  /* CÓ TÍN HIỆU HAY KHÔNG — đúng bộ điều kiện cũ, chỉ gom lại một chỗ để bảng
     LONG/SHORT và ô nhận định chi tiết luôn nói cùng một câu */
  const phat = warmLeft <= 0 && Math.abs(S) >= 25 && act.length >= 2
               && !flowConflict && !satNoConfirm && !!sup && !!res;

  E.pred = {ready: true, S, conf, active: act.length, sup, res, cap, eta,
            f5, f30, L, SL, mid, step: A.step, frameH, bookM,
            flowConflict, satNoConfirm, warmLeft, phat,
            mua30, ban30, bbOkx: A.bbOkx, baOkx: A.baOkx,
            sig: {f30: sFlow30, f5: sFlow5, bk: sBook, oi: sOi, fu: sFund, lq: sLiq},
            /* NULL = THIẾU dữ liệu, khác hẳn 0 = trung tính. Ghi 0 cho cả hai là
               dạy mô hình sau này rằng "không có tin gì" giống "tin trung lập". */
            sigCo: {f30: true, f5: true, lq: true,
                    bk: (tb + ta) > 0,
                    oi: dOi25 !== null,
                    fu: f8 !== null},
            exMask: EX.reduce((m, e) => m | (E.conns[e.key].state === 'live' ? E.conns[e.key].bit : 0), 0),
            tuoiCoin: E.listTime ? (now - E.listTime) / 86400000 : null};
  const pred = E.pred;

  /* mục tiêu TẦM XA: cùng hướng với máy nhưng mốc là TƯỜNG LỚN trong tầm 12%,
     tối thiểu cách 3% (gần hơn thì đã có vùng chốt nhanh lo) */
  if (Math.abs(S) >= 25 && act.length >= 2 && !flowConflict){
    const dirF = Math.sign(S);
    const farW = dirF > 0 ? bestWall(E, A.asksOkx, 'a', mid, 0.12, false)
                          : bestWall(E, A.bidsOkx, 'b', mid, 0.12, true);
    const distF = farW ? Math.abs(farW.p - mid) / mid : 0;
    pred.far = (farW && distF >= 0.03) ? {p: farW.p, m: farW.m, trust: farW.trust, dir: dirF} : null;
  } else pred.far = null;

  /* ---- BẢN ĐỒ MỐC: tường lớn hai phía + độ trống phía sau ---- */
  const decorate = (arr, rows, isBid) => arr.map((L2, i) => {
    const nextP = arr[i + 1] ? arr[i + 1].p : null;
    let gap = 0;
    for (const r of rows){
      const between = isBid ? (r.p < L2.p && (nextP === null || r.p > nextP))
                            : (r.p > L2.p && (nextP === null || r.p < nextP));
      if (between) gap += r.m;
    }
    const tgtP = nextP !== null ? nextP : mid * (isBid ? 0.85 : 1.15);
    return {p: L2.p, m: L2.m, trust: L2.trust, ex: L2.ex, gap, thin: gap < 0.5 * L2.m, tgtP};
  });
  pred.levels = {
    res: decorate(pickLevels(E, A.asksOkx, 'a', mid, false), A.asksOkx, false),
    sup: decorate(pickLevels(E, A.bidsOkx, 'b', mid, true), A.bidsOkx, true)
  };

  /* theo dõi VƯỢT mốc: phân biệt tường bị ĂN thật (vượt có lực) vs tường TỰ RÚT (bẫy) */
  const lvlWatch = E.lvlWatch;
  for (const sideName of ['res', 'sup']){
    const ab = sideName === 'res' ? 'a' : 'b';
    for (const L2 of pred.levels[sideName]){
      const key = ab + ':' + L2.p.toPrecision(6);
      if (!lvlWatch[key]){
        const w = E.wallBook[wallKey(ab, L2.p)] || {};
        lvlWatch[key] = {p: L2.p, ab, m: L2.m, thin: L2.thin, tgtP: L2.tgtP,
                         fl0: w.fl || 0, pl0: w.pl || 0};
      }
      lvlWatch[key].seen = now;
    }
  }
  if (E.lastMidForBrk !== null){
    for (const key in lvlWatch){
      const W = lvlWatch[key];
      const up = W.ab === 'a';
      const crossed = up ? (E.lastMidForBrk <= W.p && mid > W.p * 1.001)
                         : (E.lastMidForBrk >= W.p && mid < W.p * 0.999);
      if (crossed){
        const w = E.wallBook[wallKey(W.ab, W.p)];
        const dFl = w ? (w.fl || 0) - W.fl0 : 0;
        const dPl = w ? (w.pl || 0) - W.pl0 : 0;
        const clean = dFl > 0 && dPl === 0 ? true : (dPl > 0 ? false : null);
        E.brkAlert = {t: now, warn: clean === false,
          txt: (up ? '⚡ Vừa VƯỢT kháng cự ' : '⚡ Vừa THỦNG đỡ ') + fmtPrice(W.p, A.step)
            + (clean === true ? ' — tường bị ĂN bằng tiền thật → cú vượt có lực'
               : clean === false ? ' — tường TỰ RÚT trước khi giá tới → coi chừng bẫy'
               : ' — chưa rõ tường bị ăn hay rút')};
        delete lvlWatch[key];
      } else if (now - (W.seen || 0) > 600e3) delete lvlWatch[key];
    }
  }
  E.lastMidForBrk = mid;
}

/* ==================================================================
   THANH LÝ OKX — MỘT socket dùng chung cho toàn sàn
   Kênh liquidation-orders nhận theo instType chứ không theo từng coin, nên chỉ cần
   ĐÚNG MỘT subscription rồi định tuyến về engine tương ứng theo instId.
   Vá lỗ hổng lớn nhất hiện tại: tín hiệu sLiq (trọng số 0.20 — nặng thứ hai trong
   6 tín hiệu) trước đây chỉ lấy từ forceOrder của Binance, tức không có một byte
   nào từ chính sàn mà lệnh được đặt.
   ================================================================== */
/* Socket thanh lý dùng chung toàn sàn. Bốn biến giám sát vì đây là nguồn duy nhất của
   tín hiệu sLiq (trọng số 0.20 — nặng thứ hai), mà nó nằm ngoài mọi engine nên không
   được bộ canh chừng theo-sàn nào che. */
let wsLiq = null, lqTimers = [], lqLastMsg = 0, lqLastData = 0, lqLoiCuoi = '';
function moSocketThanhLy(){
  lqTimers.forEach(clearInterval); lqTimers = [];
  let ws;
  try { ws = new WebSocket('wss://ws.okx.com:8443/ws/v5/public'); }
  catch(e){ setTimeout(moSocketThanhLy, 5000); return; }
  wsLiq = ws;
  ws.onopen = () => {
    lqLastMsg = Date.now();          /* mốc khởi điểm để canh chừng không kích oan */
    ws.send(JSON.stringify({op:'subscribe', args:[{channel:'liquidation-orders', instType:'SWAP'}]}));
    lqTimers.push(setInterval(() => { try{ ws.send('ping'); }catch(e){} }, 25000));
  };
  ws.onmessage = e => {
    /* MỌI gói tin, kể cả `pong`, làm mới lqLastMsg. Ở đây dùng `pong` là ĐÚNG (khác
       hẳn các sàn khác): thanh lý là sự kiện thưa, có thể im hàng giờ một cách hoàn
       toàn bình thường, nên "im lặng dữ liệu" không thể dùng làm dấu hiệu chết. Ta tự
       ping mỗi 25 giây nên pong phải về đều — quá 60 giây không gói nào là socket
       thật sự đã chết. */
    lqLastMsg = Date.now();
    if (e.data === 'pong') return;
    let d; try{ d = JSON.parse(e.data); }catch(_){ return; }
    /* Sàn TỪ CHỐI đăng ký thì trả {event:'error',...}. Bản trước lọc thẳng gói này đi
       ở dòng dưới, nên socket vẫn mở, ping vẫn chạy, mà KHÔNG BAO GIỜ có dữ liệu.
       Hậu quả: sLiq là tín hiệu nặng thứ hai (trọng số 0.20) — mọi kèo từ đó về sau
       sinh ra với sig_lq = NULL, và vài tuần sau không cách nào phân biệt "không có
       thanh lý" với "feed đã chết". Mất là mất vĩnh viễn. */
    if (d.event === 'error'){ lqLoiCuoi = `${d.code || ''} ${d.msg || ''}`.trim(); return; }
    if (d.event) return;                        /* subscribe/unsubscribe — bỏ qua */
    if (!d.data || !d.arg || d.arg.channel !== 'liquidation-orders') return;
    lqLastData = Date.now();
    for (const row of d.data){
      const inst = row.instId || '';
      if (!inst.endsWith('-USDT-SWAP')) continue;
      const E = engines[inst.slice(0, -10)];
      if (!E) continue;                       /* coin không nằm trong tập theo dõi */
      const ctVal = E.conns.okx.qMul || 1;
      /* payload gói các lệnh trong mảng details; phòng cả trường hợp phẳng */
      const ds = Array.isArray(row.details) ? row.details : [row];
      for (const t of ds){
        const px = parseFloat(t.bkPx), sz = parseFloat(t.sz);
        if (!isFinite(px) || !isFinite(sz)) continue;
        /* posSide = phe BỊ thanh lý. Không có thì suy từ side: hệ thống BÁN ra để
           tất toán một vị thế LONG, và ngược lại. */
        const phe = t.posSide === 'long' || t.posSide === 'short'
          ? t.posSide : (t.side === 'sell' ? 'long' : 'short');
        pushLiq(E, phe, px * sz * ctVal);
      }
    }
  };
  ws.onclose = () => { if (wsLiq === ws) setTimeout(moSocketThanhLy, 3000); };
}
/* ⚠ PHẢI bọc LA_BOT. Socket này nằm NGOÀI vòng đời engine (một socket dùng chung
   toàn sàn) nên nó không được `batDauEngine` che, và đã bị bỏ sót đúng vì thế:
   chế độ xem mở một WebSocket vô ích tới OKX, rồi mỗi gói thanh lý của coin đang
   hiện lại ném TypeError vì engine do napTrangThai() dựng không có `liqs`.
   BÀI HỌC: mọi thứ đặt ở cấp cao nhất, ngoài vòng đời engine, PHẢI tự kiểm LA_BOT. */
if (LA_BOT) moSocketThanhLy();

/* ==================================================================
   VÒNG ĐỜI ENGINE
   ================================================================== */
function batDauEngine(sym, thuTu){
  if (engines[sym]) return engines[sym];
  const E = taoEngine(sym);
  engines[sym] = E;
  E.gen++;
  const g = E.gen;
  E.engineStart = Date.now();
  /* rải lệnh gọi REST theo thứ tự coin để 8 engine không bắn cùng lúc vào OKX */
  const tre = (thuTu || 0) * 400;
  E.timers.push(setTimeout(() => { if (g === E.gen){ pollMarket(E, g); pollCandles(E, g); } }, tre));
  E.timers.push(setInterval(() => { if (g === E.gen) pollMarket(E, g); }, 60000));
  E.timers.push(setInterval(() => { if (g === E.gen) pollCandles(E, g); }, 900000));
  /* RẢI CẢ phần mở socket theo cùng nhịp 400ms, không chỉ rải lệnh gọi REST.
     Trước đây 4 socket của cả 8 engine được mở CÙNG LÚC ở khởi động nguội — 32 cú bắt
     tay trong một nhịp, đủ để OKX chặn nhịp và trả `event:error`. Mà một lần bị chặn
     là sàn đó rơi vào 'off', và mất OKX nghĩa là coin đó không sinh được kèo nào (mọi
     giá vào/chốt lấy từ sổ riêng OKX). Bộ canh chừng có thử lại sau 5 phút, nhưng
     phòng từ đầu rẻ hơn hẳn. */
  E.timers.push(setTimeout(() => {
    if (g !== E.gen) return;
    startBinance(E, g, false);
    startBybit(E, g, 0);
    startOkx(E, g);
    startBitget(E, g, 0);
  }, tre));
  return E;
}
function dungEngine(sym){
  const E = engines[sym];
  if (!E) return;
  E.gen++;                                   /* mọi callback cũ tự chết */
  for (const k in E.conns) clearConn(E.conns[k]);
  E.timers.forEach(t => { clearInterval(t); clearTimeout(t); });
  E.timers = [];
  delete engines[sym];
}

/* ==================================================================
   GỘP SỔ LỆNH
   ================================================================== */
function niceStep(x){
  if (!(x > 0)) return 0.0001;
  const e = Math.floor(Math.log10(x));
  const b = x / Math.pow(10, e);
  const n = b <= 1 ? 1 : b <= 2 ? 2 : b <= 5 ? 5 : 10;
  return n * Math.pow(10, e);
}
function fmtPrice(p, step){
  const d = Math.min(12, Math.max(0, -Math.floor(Math.log10(step))));
  return p.toFixed(d);
}
function fmtMoney(x){ return '$' + Math.round(x).toLocaleString('en-US'); }
function fmtPct(x){ return (x >= 0 ? '+' : '') + x.toFixed(2) + '%'; }
function fmtSigned(x){ return (x >= 0 ? '+' : '-') + fmtMoney(Math.abs(x)); }

function aggregate(E){
  const conns = E.conns;
  /* chống sàn lệch hệ số: lấy sàn live đầu tiên (ưu tiên Binance) làm mốc,
     sàn nào giá giữa lệch >15% so với mốc thì loại khỏi phép gộp */
  let ref = null;
  for (const e of EX){
    const c = conns[e.key];
    if (c.state !== 'live'){ c.exMid = null; continue; }
    let b = -Infinity, a = Infinity;
    for (const [p] of c.bids){ const pp = parseFloat(p) * c.pMul; if (pp > b) b = pp; }
    for (const [p] of c.asks){ const pp = parseFloat(p) * c.pMul; if (pp < a) a = pp; }
    c.exMid = (b > -Infinity && a < Infinity) ? (b + a) / 2 : (b > -Infinity ? b : (a < Infinity ? a : null));
    if (ref === null && c.exMid !== null) ref = c.exMid;
  }
  for (const k in conns){
    const c = conns[k];
    c.excluded = c.state === 'live' && c.exMid !== null && ref !== null && Math.abs(c.exMid / ref - 1) > 0.15;
  }

  let bb = -Infinity, ba = Infinity;
  /* best bid/ask RIÊNG CỦA OKX — hàng đầu của bids/asks trả về là mốc ĐÃ GOM theo
     step và đã lọc lệnh bụi, KHÔNG phải đỉnh sổ thật. Thiếu hai số này thì spread
     thật không tính được và mọi cột giá trong bảng log sẽ bị điền bằng mid. */
  let bbOkx = null, baOkx = null;
  const allB = [], allA = [];
  for (const k in conns){
    const c = conns[k];
    if (c.state !== 'live' || c.excluded) continue;
    const laOkx = c.key === 'okx';
    for (const [p, q] of c.bids){
      const pp = parseFloat(p) * c.pMul, qq = q * c.qMul;
      if (!(qq > 0) || !(pp > 0)) continue;
      allB.push([pp, qq, c.bit]);
      if (pp > bb) bb = pp;
      if (laOkx && (bbOkx === null || pp > bbOkx)) bbOkx = pp;
    }
    for (const [p, q] of c.asks){
      const pp = parseFloat(p) * c.pMul, qq = q * c.qMul;
      if (!(qq > 0) || !(pp > 0)) continue;
      allA.push([pp, qq, c.bit]);
      if (pp < ba) ba = pp;
      if (laOkx && (baOkx === null || pp < baOkx)) baOkx = pp;
    }
  }
  if (!allB.length && !allA.length) return null;
  const mid = (bb > -Infinity && ba < Infinity) ? (bb + ba) / 2 : (bb > -Infinity ? bb : ba);
  /* bước giá tự điều chỉnh: phủ toàn bộ dải dữ liệu thật vào ~40 mốc (20 mỗi bên) */
  /* tính dải giá CHỈ trên mốc có tiền thật (≥$200) — lệnh bụi ở xa từng kéo giãn thước đo */
  let lo = Infinity, hi = -Infinity;
  for (const [p, q] of allB){ if (p * q >= 200 && p < lo) lo = p; }
  for (const [p, q] of allA){ if (p * q >= 200 && p > hi) hi = p; }
  let span = (isFinite(lo) && isFinite(hi)) ? hi - lo : 0;
  if (!(span > 0)) span = mid * 0.002;
  const step = niceStep(span / 80);
  /* Gom mốc: mỗi bucket giữ TIỀN GỘP 4 SÀN (m) và TIỀN RIÊNG CỦA OKX (mOkx).
     Lý do phải tách: chủ dự án đặt lệnh trên OKX, nên một "tường" 80% nằm ở Binance là
     tường KHÔNG chặn được giá trên OKX — đặt chốt lời ở đó là đặt vào chỗ trống. */
  const bitOkx = conns.okx.bit;
  const bMap = new Map(), aMap = new Map();
  for (const [p, q, bit] of allB){
    const key = Math.floor(p / step + 1e-9);
    const o = bMap.get(key) || {q:0, m:0, ex:0, mOkx:0};
    o.q += q; o.m += p * q; o.ex |= bit;
    if (bit === bitOkx) o.mOkx += p * q;
    bMap.set(key, o);
  }
  for (const [p, q, bit] of allA){
    const key = Math.ceil(p / step - 1e-9);
    const o = aMap.get(key) || {q:0, m:0, ex:0, mOkx:0};
    o.q += q; o.m += p * q; o.ex |= bit;
    if (bit === bitOkx) o.mOkx += p * q;
    aMap.set(key, o);
  }
  /* không giới hạn số mốc CÓ NGHĨA — nhưng lọc bỏ mốc rác (lệnh bụi vặt làm loạn bảng):
     ẩn mốc dưới 0.4% tường lớn nhất và dưới $150 */
  const bids0 = [...bMap.entries()].sort((x, y) => y[0] - x[0])
    .map(([k, o]) => ({p: k * step, q: o.q, m: o.m, ex: o.ex, mOkx: o.mOkx}));
  const asks0 = [...aMap.entries()].sort((x, y) => x[0] - y[0])
    .map(([k, o]) => ({p: k * step, q: o.q, m: o.m, ex: o.ex, mOkx: o.mOkx}));
  const maxBucket = Math.max(1, ...bids0.map(r => r.m), ...asks0.map(r => r.m));
  const dustTh = Math.max(150, 0.004 * maxBucket);
  const bids = bids0.filter(r => r.m >= dustTh);
  const asks = asks0.filter(r => r.m >= dustTh);

  /* Sổ RIÊNG OKX — dùng để chọn giá vào / giá chốt và vẽ bản đồ mốc.
     `m` là tiền THẬT trên OKX (thứ có thể khớp được), còn `ex` vẫn giữ bitmask gộp 4 sàn
     để biết mốc đó có được sàn khác xác nhận hay chỉ mình OKX có. Cùng `step` với sổ gộp
     nên khoá tra `wallTrust` khớp nhau, không phải làm gì thêm. */
  const maxOkx = Math.max(1, ...bids0.map(r => r.mOkx), ...asks0.map(r => r.mOkx));
  const dustOkx = Math.max(150, 0.004 * maxOkx);
  const loc = arr => arr.filter(r => r.mOkx >= dustOkx)
    .map(r => ({p: r.p, m: r.mOkx, ex: r.ex, mGop: r.m}));
  return {bids, asks, bidsOkx: loc(bids0), asksOkx: loc(asks0), mid, step, bbOkx, baOkx};
}

/* nhịp phân tích: 2 giây/lần, chạy cho TẤT CẢ engine đang theo dõi.
   CHỈ chế độ bot. Trang xem không phân tích gì — nó chỉ vẽ lại ảnh trạng thái. */
if (LA_BOT) setInterval(() => {
  for (const sym in engines){
    const E = engines[sym];
    const A = aggregate(E);
    updateWalls(E, A);
    analyze(E, A);
    sinhKeo(E);
  }
}, 2000);

/* ==================================================================
   CANH CHỪNG — và NỐI LẠI, không chỉ đổi nhãn

   Bản đầu chỉ `setState(c,'wait',...)` rồi để đó. Đường nối lại duy nhất còn lại là
   `ws.onclose`, mà socket "nửa mở" (half-open) qua NAT/proxy thì KHÔNG BAO GIỜ sinh
   onclose — nên nó nằm ở 'wait' vô thời hạn. Với app trong tab trình duyệt thì người
   dùng F5 là xong; với bot chạy nhiều ngày không ai xem thì đó là mất một sàn vĩnh viễn.

   Đo bằng `lastData` (dữ liệu thật) chứ không `lastMsg` (tính cả pong) — lý do ghi ở
   chỗ khai báo hai trường đó.
   ================================================================== */
/* Nối lại luôn bắt đầu từ BIẾN THỂ ĐẦU (variant/vi = 0), tức làm lại như lần đầu.
   Không truyền biến thể cũ vào: `clearConn` đã xoá `c.variant`, và quan trọng hơn là
   tên hợp đồng có thể đã đổi (sàn đổi hệ số 1000X ↔ X1000) đúng trong lúc mất kết nối. */
const MO_LAI = {
  binance: (E, g) => startBinance(E, g, false),   /* khớp y batDauEngine */
  bybit:   (E, g) => startBybit(E, g, 0),
  okx:     (E, g) => startOkx(E, g),
  bitget:  (E, g) => startBitget(E, g, 0),
};

if (LA_BOT) setInterval(() => {
  const now = Date.now();
  for (const sym in engines){
    const E = engines[sym];
    for (const k in E.conns){
      const c = E.conns[k];
      /* 'live' mà kênh dữ liệu im quá 60 giây (gấp đôi chu kỳ ping dài nhất là 25s,
         nên không thể là nhịp ping bình thường) → nối lại thật. */
      if (c.state === 'live' && c.lastData && now - c.lastData > 60000){
        c.soLanNoiLai++;
        clearConn(c);
        setState(c, 'wait', `kênh im ${Math.round((now - c.lastData) / 1000)}s — nối lại (lần ${c.soLanNoiLai})`);
        const g = E.gen, mo = MO_LAI[k];
        if (mo) c.timers.push(setTimeout(() => { if (g === E.gen) mo(E, g); }, 1000));
      }
      /* 'off' là ngõ cụt: sàn báo lỗi hoặc dò hết biến thể tên hợp đồng rồi bỏ. Với
         bot chạy nhiều ngày, "bỏ vĩnh viễn" là sai — một lỗi tạm thời lúc khởi động
         nguội (8 engine bắt tay OKX cùng lúc, dễ bị chặn nhịp) sẽ giết hẳn sàn đó cho
         coin đó. Nặng nhất là mất OKX: mọi giá VÀO/CHỐT lấy từ SỔ RIÊNG OKX, nên
         bestWall trả null và coin đó KHÔNG BAO GIỜ sinh kèo nữa, trong khi `pred.ready`
         vẫn true và 3 sàn còn lại vẫn 'live'. Coin GHIM thì máy quét không bao giờ gỡ
         nên cũng không có đường tự hồi phục.
         Nên: thử lại sau 5 phút, mãi mãi. Cặp thật sự không tồn tại thì lần thử sau
         cũng chỉ tốn một lần bắt tay mỗi 5 phút — rẻ hơn hẳn mất một sàn nhiều ngày. */
      else if (c.state === 'off' && c.lucOff && now - c.lucOff > 300000){
        c.soLanNoiLai++;
        const g = E.gen, mo = MO_LAI[k];
        if (mo){ setState(c, 'wait', `thử lại sau khi tắt (lần ${c.soLanNoiLai})`); mo(E, g); }
      }

      /* Socket thứ 2 của Binance (aggTrade + forceOrder) sống RIÊNG với socket sổ lệnh
         nên nó có thể chết nửa-mở mà socket depth vẫn 'live'. Khi đó dòng tiền khớp
         mất nguồn Binance âm thầm — mà sFlow30 (0.30) + sFlow5 (0.15) là 45% tổng
         trọng số, tức điểm S lệch hệ thống theo hướng không đoán được, không một chỉ
         số nào nói lên. Coin nào cũng phải có khớp lệnh trong 3 phút ở mức thanh khoản
         > 200k USD/24h, nên im quá 180 giây là bất thường. */
      if (k === 'binance' && c.state === 'live' && c.lastData2
          && now - c.lastData2 > 180000 && c.moLaiWs2){
        c.soLanNoiLai++;
        c.lastData2 = now;                  /* tránh kích lại liên tục khi mở lại chậm */
        try{ if (c.ws2) c.ws2.close(); }catch(e){}
        c.moLaiWs2();
      }
    }
  }

  /* Canh chừng socket THANH LÝ (ngoài mọi engine, nên không bộ nào khác che nó).
     Đo bằng lqLastMsg — tính cả `pong` — vì thanh lý là sự kiện thưa, im hàng giờ là
     bình thường; ta tự ping 25 giây/lần nên quá 60 giây không gói nào là socket chết. */
  if (wsLiq && lqLastMsg && now - lqLastMsg > 60000){
    lqLoiCuoi = `im ${Math.round((now - lqLastMsg) / 1000)}s — nối lại`;
    lqLastMsg = now;                        /* tránh đóng liên tiếp trong lúc mở lại */
    try{ wsLiq.close(); }catch(e){}         /* onclose tự gọi lại moSocketThanhLy */
  }
}, 3000);

/* ==================================================================
   HIỂN THỊ — hai bảng LONG / SHORT + khối chi tiết của coin đang chọn
   ================================================================== */

/* GIÁ VÀO / GIÁ CHỐT — không phát minh logic mới, chỉ đọc lại đúng hai tường
   mà máy đã chọn: kèo LONG vào tại tường ĐỠ dưới và chốt tại tường KHÁNG trên;
   kèo SHORT thì ngược lại. */
/* HỆ SỐ CẮT LỖ: cắt lỗ đặt VƯỢT QUA tường vào một khoảng bằng ngần này lần biên
   khung. Đây là THAM SỐ TỰ CHỌN, chưa có dữ liệu nào chứng minh 0.30 là đúng —
   phải đo lại khi có sổ log rồi mới chỉnh. */
const HE_SO_CAT = 0.30;

/* Hash TỰ SINH từ chính bộ tham số quyết định. Tự sinh nên không bao giờ quên
   cập nhật khi chỉnh trọng số — mà trộn dữ liệu trước/sau một lần chỉnh là mọi
   so sánh về sau thành rác. Đổi bất kỳ số nào dưới đây là hash tự đổi theo. */
const VER_TRONG_SO = (() => {
  const ts = [0.30, 0.15, 0.15, 0.10, 0.10, 0.20,   /* 6 trọng số */
              25, 2, 0.3, 0.99, 0.2,                /* 4 chốt chặn */
              HE_SO_CAT, NGUONG_GHI, 0.005, 0.15];  /* cắt lỗ, ngưỡng ghi, dải sổ, tầm tường */
  let h = 5381;
  for (const x of ts){ const str = String(x); for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0; }
  return 'v' + h.toString(36);
})();

function keoCua(E){
  const P = E.pred;
  if (!P.ready || !P.phat) return null;
  const isLong = P.S > 0;
  const vao = isLong ? P.sup : P.res, chot = isLong ? P.res : P.sup;
  /* Cắt lỗ = vượt qua tường vào. Vào tại tường đỡ mà tường đó thủng nghĩa là
     giả định gốc sai — đó mới là điểm vô hiệu, không phải tường đối diện. */
  const cat = vao.p + (isLong ? -1 : 1) * HE_SO_CAT * P.cap * P.mid;
  const dChot = Math.abs(chot.p - vao.p), dCat = Math.abs(vao.p - cat);
  return {
    sym: E.sym, isLong, S: P.S, conf: P.conf, mid: P.mid, step: P.step,
    vao, chot, cat,
    rr: dCat > 0 ? dChot / dCat : null,
    /* MỐC SO SÁNH: với giá đi ngẫu nhiên không xu hướng, xác suất chạm chốt trước
       khi chạm cắt lỗ xấp xỉ đúng bằng tỷ lệ này. Mọi tỷ lệ thắng đo được về sau
       phải so với con số NÀY chứ không phải với 50%. */
    baseline: (dChot + dCat) > 0 ? dCat / (dChot + dCat) : null
  };
}

function trustChip(t){
  return `<span class="trust ${t >= 55 ? 'hi' : t >= 35 ? 'mid' : ''}">tin ${t}</span>`;
}

/* MỘT THẺ COIN = toàn bộ thông tin của kèo đó, tự chứa: đầu thẻ, cảnh báo,
   vùng giao dịch (vào / chốt / trần / sàn / ETA / tầm xa), dòng căn cứ, bản đồ mốc.
   Gộp hết vào đây vì các panel chi tiết riêng đã bị bỏ khỏi giao diện. */
function theCoin(E, K){
  const P = E.pred, market = E.market, step = P.step, mid = P.mid;
  const isLong = K.isLong, vao = K.vao, chot = K.chot;
  const fH = market.fundH || 8;

  /* ---- đầu thẻ ---- */
  let chg = '';
  if (market.ref && market.ref.c24 > 0){
    const c = (mid / market.ref.c24 - 1) * 100;
    chg = `<span class="ccChg">24h <b class="${c >= 0 ? 'up' : 'dn'}">${(c >= 0 ? '+' : '') + c.toFixed(1)}%</b></span>`;
  }
  const nb = Math.max(1, Math.min(5, Math.round(P.conf / 20)));
  let h = `<div class="ccHead">
    <span class="ccSym">${E.sym}</span>
    <span class="ccPrice">${fmtPrice(mid, step / 10)}</span>
    ${chg}
    <span class="ccS ${isLong ? 'up' : 'dn'}">${P.S >= 0 ? '+' : ''}${Math.round(P.S)}</span>
    <span class="ccConf">tin cậy ${'█'.repeat(nb)}${'░'.repeat(5 - nb)} ${P.conf}%</span>
  </div>`;

  /* ---- cảnh báo ---- */
  const canhBao = [];
  const f8 = (market.funding !== null && isFinite(market.funding)) ? market.funding * (8 / fH) : null;
  if (f8 !== null && Math.abs(f8) >= 0.0005)
    canhBao.push(`⚠ Funding ${(market.funding * 100).toFixed(3)}%/${fH}h — phe ${f8 < 0 ? 'SHORT' : 'LONG'} đông nghẹt, rủi ro squeeze ${f8 < 0 ? 'LÊN' : 'XUỐNG'}`);
  if (P.bookM < 300000)
    canhBao.push(`⚠ Sổ lệnh mỏng (${fmtMoney(P.bookM)}) — coin dễ bị đạo diễn, mọi tín hiệu kém tin cậy`);
  if (P.tuoiCoin !== null && P.tuoiCoin < 7)
    canhBao.push(`⚠ Coin mới niêm yết ${P.tuoiCoin.toFixed(0)} ngày — chưa đủ lịch sử để biên khung và điểm tin tường có nghĩa`);
  if (canhBao.length) h += `<div class="ccWarn">${canhBao.join('<br>')}</div>`;
  /* gioBot() chứ không Date.now(): `brkAlert.t` do bot đặt bằng đồng hồ bot, so với
     đồng hồ trình duyệt là sai khi hai máy lệch giờ — cảnh báo ⚡ sẽ ẩn ngay hoặc
     dính quá 10 phút, làm sai nghĩa của chữ "vừa". */
  if (E.brkAlert && gioBot() - E.brkAlert.t < 600e3)
    h += `<div class="ccBrk ${E.brkAlert.warn ? 'w1' : 'cUp'}">${E.brkAlert.txt}</div>`;

  /* ---- vùng giao dịch ---- */
  const zRow = (tag, cls, W, why) => `<div class="zRow">
    <div class="zTop"><span class="zTag ${cls}">${tag}</span>
      <span class="zP">${fmtPrice(W.p, step)}</span>
      <span class="zPct">${fmtPct((W.p / mid - 1) * 100)}</span></div>
    <div class="zWhy">${why}</div></div>`;
  /* W.m là tiền TRÊN OKX; W.ex là bitmask gộp 4 sàn nên bitCount==1 nghĩa là
     chỉ mình OKX có tiền ở mốc này — không sai, nhưng kém được xác nhận hơn */
  const moTa = (W, ab, loai) => `tường ${loai} <b>${fmtMoney(W.m)}</b> trên OKX · tin ${W.trust}/100`
    + (wallInfo(E, ab, W.p) ? ' · ' + wallInfo(E, ab, W.p) : '')
    + (bitCount(W.ex || 0) <= 1 ? ' · <span class="w1">⚠ chỉ OKX có</span>'
       : ` · ${bitCount(W.ex)} sàn cùng có`);
  h += zRow('VÀO', isLong ? 'cUp' : 'cDn', vao, moTa(vao, isLong ? 'b' : 'a', isLong ? 'mua' : 'bán'));
  h += zRow('CHỐT', '', chot, moTa(chot, isLong ? 'a' : 'b', isLong ? 'bán' : 'mua'));
  h += `<div class="zRow"><div class="zTop"><span class="zTag w1">CẮT</span>
      <span class="zP">${fmtPrice(K.cat, step)}</span>
      <span class="zPct">${fmtPct((K.cat / mid - 1) * 100)}</span></div>
    <div class="zWhy">vượt qua tường vào ${(HE_SO_CAT * 100).toFixed(0)}% biên khung — tường vào thủng là giả định gốc sai</div></div>`;

  /* RR và mốc so sánh: tỷ lệ thắng không kèm hai số này là con số vô nghĩa.
     baseline = xác suất chạm chốt trước nếu giá đi hoàn toàn ngẫu nhiên. */
  const mini = [];
  if (K.rr !== null) mini.push(`R:R <b>${K.rr.toFixed(2)}</b>`);
  if (K.baseline !== null) mini.push(`cần thắng &gt; <b>${(K.baseline * 100).toFixed(0)}%</b> mới hơn ngẫu nhiên`);
  mini.push(`trần ${P.frameH}h <b>${fmtPrice(mid * (1 + P.cap), step)}</b>`,
            `sàn ${P.frameH}h <b>${fmtPrice(mid * (1 - P.cap), step)}</b>`);
  if (P.eta !== null && P.eta >= 0 && P.eta < 600) mini.push(`⏱ ETA <b>${P.eta}'</b>`);
  if (P.far) mini.push(`tầm xa <b>${fmtPrice(P.far.p, step)}</b> (${fmtPct((P.far.p / mid - 1) * 100)} · tin ${P.far.trust})`);
  h += `<div class="zMini">${mini.join(' &nbsp;·&nbsp; ')}</div>`;

  /* ---- dòng căn cứ (số liệu thật đang đo) ---- */
  h += `<div class="ccBasis">khung <b>${P.frameH}h</b>`
    + ` · dòng 30' <b class="${P.f30 >= 0 ? 'up' : 'dn'}">${fmtSigned(P.f30)}</b>`
    + ` · 5' <b class="${P.f5 >= 0 ? 'up' : 'dn'}">${fmtSigned(P.f5)}</b>`
    + (market.funding !== null ? ` · funding <b>${(market.funding * 100).toFixed(3)}%/${fH}h</b>` : '')
    + ((P.L || P.SL) ? ` · thanh lý 5' long <b>${fmtMoney(P.L)}</b> / short <b>${fmtMoney(P.SL)}</b>` : '')
    + ` · biên <b>±${(P.cap * 100).toFixed(1)}%</b></div>`;

  /* ---- bản đồ mốc ---- */
  if (P.levels){
    const maxM = Math.max(1, ...P.levels.res.map(L => L.m), ...P.levels.sup.map(L => L.m));
    const lvlRow = (L, i, isRes) => {
      const w = Math.max(5, Math.round(L.m / maxM * 100));
      const note = L.thin
        ? `${isRes ? 'vượt' : 'thủng'} → <b class="w1">TRỐNG</b> tới ${fmtPrice(L.tgtP, step)} (${fmtPct((L.tgtP / mid - 1) * 100)})`
        : `sau lưng còn ${fmtMoney(L.gap)} chắn`;
      return `<div class="lvl">
        <div class="lvlTag ${isRes ? 'cDn' : 'cUp'}">${isRes ? 'KHÁNG CỰ' : 'ĐỠ'} ${i + 1}</div>
        <div class="lvlMain">
          <span class="lvlP">${fmtPrice(L.p, step)}</span>
          <span class="lvlPct">${fmtPct((L.p / mid - 1) * 100)}</span>
          <span class="lvlBar"><i style="width:${w}%;background:var(--${isRes ? 'red' : 'green'})"></i></span>
          <span class="lvlM">${fmtMoney(L.m)}</span>
          ${trustChip(L.trust)}
          ${bitCount(L.ex || 0) <= 1 ? '<span class="trust w1">chỉ OKX</span>' : ''}
        </div>
        <div class="lvlNote">${note}</div>
      </div>`;
    };
      h += '<div class="ccMap"><div class="ccMapTit">BẢN ĐỒ MỐC (sổ OKX) — vượt mốc TRỐNG là chạy nhanh</div>'
      + P.levels.res.map((L, i) => ({L, i})).reverse().map(x => lvlRow(x.L, x.i, true)).join('')
      + `<div class="nowLine">${fmtPrice(mid, step / 10)}</div>`
      + P.levels.sup.map((L, i) => lvlRow(L, i, false)).join('')
      + '</div>';
  }
  return `<div class="coinCard ${isLong ? 'long' : 'short'}">${h}</div>`;
}

/* DÒNG CHẨN ĐOÁN — tách thành hàm riêng và gọi TRƯỚC khi vẽ thẻ.
   Trước đây nó nằm ở cuối renderLists(), nghĩa là một ngoại lệ khi dựng thẻ coin
   sẽ bịt miệng đúng cái lưới an toàn duy nhất: trang đứng hình mà dòng chú thích
   kẹt ở giá trị cũ, không bao giờ đổi. Chẩn đoán phải được vẽ trước nội dung. */
function veChuThich(){
  const syms = Object.keys(engines);
  let live = 0, am = 0, chet = 0;
  for (const s of syms){
    live += Object.values(engines[s].conns || {}).filter(c => c.state === 'live').length;
    const P = engines[s].pred || {};
    /* Tách hai nguyên nhân: "chưa hết warmup 90 giây" khác hẳn "mất hết sàn nên
       không gộp được sổ". Gộp chung một nhãn là người xem chờ mãi một thứ sẽ không
       bao giờ tới. */
    if (P.ready && P.warmLeft > 0) am++;
    else if (!P.ready) chet++;
  }
  const tLog = logStat.loi ? `log: ${logStat.gui} gửi · ${logStat.loi} LỖI (${logStat.loiCuoi})`
    : `log: ${logStat.gui} gửi${logStat.cho ? ' · ' + logStat.cho + ' chờ' : ''}`;
  let t = `${syms.length} coin đang theo dõi · ${live}/${syms.length * 4} sàn live`
    + (am ? ` · ${am} chưa ấm máy` : '')
    + (chet ? ` · ⚠ ${chet} MẤT SỔ` : '')
    + ' · ' + tLog;

  if (!LA_BOT){
    /* Bot chết là kiểu hỏng IM LẶNG nguy hiểm nhất: ảnh đứng lại, trang vẫn vẽ y
       nguyên thẻ cũ, người xem tưởng thị trường đang yên.
       ⚠ ĐO BẰNG MỘT ĐỒNG HỒ DUY NHẤT. Bản đầu lấy `Date.now() - j.luc`, tức trừ
       đồng hồ trình duyệt cho đồng hồ server — điện thoại lệch NTP vài phút là
       cảnh báo này im vĩnh viễn (lệch chậm) hoặc kêu vĩnh viễn (lệch nhanh), mà
       kêu oan vài lần là người xem học cách phớt lờ đúng cảnh báo quan trọng nhất.
       Nay đo khoảng cách từ lần CUỐI nhận được ảnh MỚI, cùng một đồng hồ client —
       miễn nhiễm lệch giờ, và bắt được cả trường hợp bot còn sống nhưng ghi ảnh
       lỗi (file không đổi nội dung). */
    const tre = mocAnhMoi ? Math.round((Date.now() - mocAnhMoi) / 1000) : null;
    if (verBot && verBot !== VER_TRONG_SO)
      /* Lỗ riêng của kiến trúc "bot NẠP index.html": sửa thuật toán rồi tải file
         mới lên mà quên restart bot → bot vẫn chạy khối <script> đã eval từ trước,
         ghi DB bằng bản cũ với cột `ver` cũ, còn trang thì vẽ theo bản mới. Không
         có cách nào khác phát hiện. */
      t = `⛔ BOT ĐANG CHẠY BẢN CŨ (${verBot} ≠ ${VER_TRONG_SO}) — phải dung.sh rồi chay.sh`;
    else if (napLoi)
      t = `⛔ ẢNH TRẠNG THÁI SAI CẤU TRÚC (${napLoi}) — bot và trang lệch phiên bản?`;
    else if (tre === null)
      t = '⛔ CHƯA TẢI ĐƯỢC trangthai.json — bot có đang chạy không?';
    else if (tre > 30)
      t = `⛔ DỮ LIỆU CŨ ${tre}s — bot có thể đã chết, ĐỪNG đọc số bên dưới`;
    else t = `XEM · dữ liệu ${tre}s trước · ` + t;
  }
  $('scanNote').textContent = t;
}

function renderLists(){
  veChuThich();                          /* vẽ TRƯỚC, xem lý do ở trên */
  const longs = [], shorts = [];
  for (const sym of Object.keys(engines)){
    const K = keoCua(engines[sym]);
    if (K) (K.isLong ? longs : shorts).push(K);
  }
  longs.sort((a, b) => b.S - a.S);      /* điểm mạnh nhất lên đầu */
  shorts.sort((a, b) => a.S - b.S);

  $('listLong').innerHTML = longs.length
    ? longs.map(K => theCoin(engines[K.sym], K)).join('')
    : '<div class="emptyList">Chưa coin nào đủ điều kiện long</div>';
  $('listShort').innerHTML = shorts.length
    ? shorts.map(K => theCoin(engines[K.sym], K)).join('')
    : '<div class="emptyList">Chưa coin nào đủ điều kiện short</div>';
  $('cntLong').textContent = longs.length;
  $('cntShort').textContent = shorts.length;
  document.title = `${longs.length}L/${shorts.length}S — Sổ Lệnh Gộp`;
}

/* ==================================================================
   ẢNH TRẠNG THÁI — cầu nối duy nhất giữa bot và trang xem

   Bot gọi anhTrangThai() mỗi 2 giây, bot.js ghi kết quả ra trangthai.json.
   Trang xem gọi napTrangThai() để dựng lại đúng cấu trúc mà theCoin()/keoCua()
   đang cần, rồi vẽ bằng CÙNG hàm vẽ. Không có hàm vẽ thứ hai — tách ra là vài
   tuần sau sửa một bên quên bên kia, rồi xem một thứ mà bot ghi thứ khác.
   ================================================================== */
/* Trạng thái phía trang xem. Ba biến, ba việc khác nhau — đừng gộp:
   lucBot     = j.luc của ảnh đang hiển thị, đo bằng ĐỒNG HỒ BOT. Dùng làm "giờ hiện
                tại" cho mọi mốc thời gian do bot đặt (vd brkAlert.t), vì so mốc của
                bot với đồng hồ trình duyệt là sai khi hai máy lệch giờ.
   mocAnhMoi  = lúc CUỐI nhận được ảnh MỚI, đo bằng ĐỒNG HỒ TRÌNH DUYỆT. Dùng tính
                độ trễ — cùng một đồng hồ nên miễn nhiễm lệch giờ.
   napLoi     = lý do nạp thất bại, để phân biệt "không tải được" với "tải được
                nhưng ảnh sai cấu trúc" — hai thứ này cần hai hướng xử lý khác nhau. */
let lucBot = 0, mocAnhMoi = 0, verBot = '', napLoi = '';

/* "Giờ hiện tại" theo đồng hồ đã đặt các mốc: bot thì là đồng hồ của chính nó,
   trang xem thì là đồng hồ bot đọc từ ảnh. */
const gioBot = () => LA_BOT ? Date.now() : (lucBot || Date.now());

function anhTrangThai(){
  logStat.cho = hangDoi.length;
  const coins = [];
  for (const sym in engines){
    const E = engines[sym], P = E.pred;
    /* Trạng thái 4 sàn phải gửi cho MỌI coin đang theo dõi, kể cả coin chưa ấm máy.
       Bỏ coin chưa ấm ra thì dòng chẩn đoán đếm thiếu và báo ví dụ "24/32 sàn live"
       trong khi thật ra 32 sàn đều sống — nhìn như đang có sàn chết. */
    const conns = {};
    for (const k in E.conns) conns[k] = {state: E.conns[k].state};
    if (!P || !P.ready){ coins.push({sym, conns, pred: {ready: false}}); continue; }

    /* CHỈ lấy 2 bản ghi tường mà wallInfo() sẽ tra. Cả wallBook có thể vài trăm
       bản ghi mỗi coin — gửi hết là vài trăm KB mỗi 2 giây, thừa 99% mà lại làm
       nặng đường truyền, nhất là khi xem bằng điện thoại. */
    const tuong = {};
    for (const [side, W] of [['b', P.sup], ['a', P.res]]){
      if (!W) continue;
      const k = wallKey(side, W.p), w = E.wallBook[k];
      if (w) tuong[k] = {f: w.f, l: w.l, sv: w.sv || 0, fl: w.fl || 0, pl: w.pl || 0};
    }
    coins.push({
      sym, pred: P, conns, tuong, brkAlert: E.brkAlert,
      /* market: đúng 3 trường mà thẻ coin dùng. oiHist/ranges/atr4h/oi là dữ liệu
         tính toán nội bộ của bot, gửi đi chỉ phình ảnh trạng thái. */
      market: {ref: E.market.ref ? {c24: E.market.ref.c24} : null,
               funding: E.market.funding, fundH: E.market.fundH}
    });
  }
  /* Bảng QUÉT chỉ hiện 6 dòng mỗi bên. Gửi 15 mỗi bên làm vùng đệm: đủ dư nếu sau
     này nới số dòng, mà vẫn nhỏ hơn gửi cả 400+ ticker của sàn. */
  const top = (f, cmp) => [...scan.rows].filter(f).sort(cmp).slice(0, 15);
  /* Đếm coin THIẾU NẾN 48h. Đây là kiểu hỏng nguy hiểm nhất trong nhóm im lặng: mọi
     chỉ báo đều xanh (đủ coin, 32/32 sàn live, 0 chưa ấm máy) và trang xem vẫn vẽ đủ
     thẻ có giá vào/chốt/cắt, NHƯNG sinhKeo() thoát ở `if (!E.market.ranges) return`
     nên bảng keo không nhận thêm một dòng nào. "log 0 gửi" khi đó bị đọc thành "chưa
     có tín hiệu đáng ghi" thay vì "bộ ghi đã tê liệt". */
  let thieuNen = 0;
  for (const sym in engines) if (!engines[sym].market.ranges) thieuNen++;
  return {
    luc: Date.now(), ver: VER_TRONG_SO, soCoin: SO_COIN,
    coins,
    scan: {
      rows: [...top(r => r.chg24 > 0, (a, b) => b.chg24 - a.chg24),
             ...top(r => r.chg24 < 0, (a, b) => a.chg24 - b.chg24)],
      ghim: [...scan.ghim],
      lucQuet: scan.lucQuet, loi: scan.loi, loiCuoi: scan.loiCuoi
    },
    /* Sức khoẻ socket thanh lý: nguồn duy nhất của sLiq (trọng số 0.20) và nó nằm
       ngoài mọi engine, nên nếu không đưa vào đây thì nó chết hoàn toàn im lặng. */
    lq: {lastMsg: lqLastMsg, lastData: lqLastData, loiCuoi: lqLoiCuoi},
    log: {gui: logStat.gui, loi: logStat.loi, loiCuoi: logStat.loiCuoi,
          cho: logStat.cho, mat: logStat.mat, thieuNen}
  };
}

function napTrangThai(j){
  /* Đọc PHÒNG VỆ và đọc HẾT trước khi chạm vào `engines`. Bản đầu xoá sạch engines
     ngay dòng đầu rồi mới đọc `j.scan.rows` — ảnh thiếu khối `scan` hay `log` (bot
     và trang lệch phiên bản) là ném lỗi giữa đường, để lại engines đã bị xoá một
     nửa và `tuoiAnh` không được gán, làm cảnh báo báo SAI nguyên nhân. */
  if (!j || typeof j !== 'object') { napLoi = 'khong phai object'; return; }
  const S = j.scan || {}, L = j.log || {}, cs = j.coins;
  if (!Array.isArray(cs)) { napLoi = 'thieu mang coins'; return; }

  /* Bỏ ảnh KHÔNG mới hơn ảnh đang hiển thị. Không có chốt này thì khi mạng tắc,
     phản hồi về không đúng thứ tự và ảnh CŨ ghi đè ảnh MỚI: thẻ nhảy lùi về trạng
     thái vài giây trước, và độ trễ hiện lên nhảy loạn — mà chính con số đó là cơ sở
     để người xem tin hay không tin màn hình. */
  if (j.luc && lucBot && j.luc <= lucBot) return;

  napLoi = '';
  verBot = j.ver || '';
  for (const k in engines) delete engines[k];
  /* Coin chưa ấm máy vẫn có mặt (chỉ mang conns + pred.ready=false): bảng QUÉT vẫn
     đánh dấu ▶ đúng, số "chưa ấm máy" đếm đúng, mà keoCua() vẫn trả null nên chúng
     không hiện thành thẻ. Không có danh sách "theodoi" riêng — một danh sách thứ hai
     nói cùng một việc là chỗ để hai bên lệch nhau. */
  for (const c of cs){
    if (!c || !c.sym) continue;
    engines[c.sym] = {sym: c.sym, pred: c.pred || {ready: false}, market: c.market || {},
                      conns: c.conns || {}, wallBook: c.tuong || {},
                      brkAlert: c.brkAlert || null};
  }
  scan.rows = Array.isArray(S.rows) ? S.rows : [];
  scan.ghim.clear();
  (Array.isArray(S.ghim) ? S.ghim : []).forEach(s => scan.ghim.add(s));
  logStat.gui = L.gui || 0; logStat.loi = L.loi || 0;
  logStat.loiCuoi = L.loiCuoi || ''; logStat.cho = L.cho || 0;
  lucBot = j.luc || 0;
  mocAnhMoi = Date.now();
}

/* Tải lại ảnh rồi vẽ.
   - Chống cache hai lớp (no-store + `?t=`): một bản bị cache là trang đứng hình mà
     không có dấu hiệu gì.
   - Trần thời gian 1500ms < nhịp 2000ms: không có nó thì mạng tắc là các fetch dồn
     thành đống, trình duyệt chỉ cho 6 kết nối một host nên phần còn lại xếp hàng và
     độ trễ thật còn tệ hơn.
   - Phần VẼ bọc try riêng và PHẢI hiện lỗi ra màn hình. Trước đây `render()` nằm
     ngoài try: một ngoại lệ khi dựng thẻ là trang đóng băng hoàn toàn — thẻ cũ còn
     nguyên, dòng chú thích kẹt ở giá trị cuối, lỗi chỉ nằm trong Console mà người
     xem trên điện thoại không bao giờ mở. Đúng kiểu hỏng im lặng bị cấm. */
async function taiTrangThai(){
  const huy = new AbortController();
  const hetGio = setTimeout(() => huy.abort(), 1500);
  try{
    const r = await fetch(FILE_TRANG_THAI + '?t=' + Date.now(),
                          {cache: 'no-store', signal: huy.signal});
    if (r.ok) napTrangThai(await r.json());
  }catch(e){ /* giữ ảnh cũ; cảnh báo độ trễ trong scanNote sẽ tự nói lên */ }
  finally{ clearTimeout(hetGio); }

  try{ render(); renderScan(); }
  catch(e){
    try{ $('scanNote').textContent = '⛔ LỖI VẼ: ' + (e && e.message || e)
      + ' — số liệu bên dưới có thể đã cũ'; }catch(_){}
  }
}

/* Đồng bộ tập ghim từ danh sách (bot đọc ~/bot/ghim.txt). Giữ ĐÚNG luật của cơ chế
   ghim cũ: ghim coin chưa theo dõi mà tập đã đầy thì nhường chỗ bằng coin KHÔNG
   ghim yếu nhất; đầy toàn coin ghim thì không nhận thêm. */
function dongBoGhim(list){
  const moi = new Set(list.filter(Boolean));
  for (const s of [...scan.ghim]) if (!moi.has(s)) scan.ghim.delete(s);
  for (const s of moi){
    if (scan.ghim.has(s)) continue;
    scan.ghim.add(s);
    if (engines[s]) continue;
    if (Object.keys(engines).length < SO_COIN){ batDauEngine(s, 0); continue; }
    let yeu = '', bs = Infinity;
    for (const k in engines){
      if (scan.ghim.has(k)) continue;
      const P = engines[k].pred, v = P.ready ? Math.abs(P.S) : 0;
      if (v < bs){ bs = v; yeu = k; }
    }
    if (yeu){ dungEngine(yeu); batDauEngine(s, 0); }
  }
}

/* 1 giây/lần là đủ: dữ liệu chỉ đổi mỗi 2 giây theo nhịp phân tích, mà mỗi lần vẽ
   là dựng lại toàn bộ thẻ (kèm bản đồ mốc) nên không nên chạy dày hơn */
/* ==================================================================
   LUẬT SINH KÈO + GỬI LOG
   Mỗi nhịp 2 giây, mỗi coin: nếu chưa có kèo đang mở và hội đủ điều kiện tối
   thiểu thì phát MỘT kèo. Ra khoảng 20-40 kèo/ngày trên 8 coin, và quan trọng
   là chúng ĐỘC LẬP với nhau — không phải 10 quan sát của cùng một cấu trúc sổ.
   ================================================================== */
function ulid(){
  const C = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';   /* Crockford base32 */
  let t = Date.now(), a = '';
  for (let i = 9; i >= 0; i--){ a = C[t % 32] + a; t = Math.floor(t / 32); }
  for (let i = 0; i < 16; i++) a += C[(Math.random() * 32) | 0];
  return a;
}
/* Giá gửi dạng CHUỖI với đúng 15 số lẻ: khớp DECIMAL(30,15) và tránh ký hiệu
   mũ (1.23e-8) mà MySQL không nhận. Coin có giá từ 0.0000000123 tới 90000. */
const sp = x => (x === null || x === undefined || !isFinite(x)) ? null : Number(x).toFixed(15);

const hangDoi = [];        /* outbox trong RAM, mất khi F5 — chấp nhận ở bản đầu */
let dangGui = false;
/* Đếm để hiển thị: không có tín hiệu sống thì sai token hay sai URL cũng im lặng,
   chạy cả tuần mới phát hiện bảng rỗng. */
/* `mat` = số kèo bị NÉM khỏi hàng đợi vì vượt trần. Không có bộ đếm này thì mất mẫu
   là mất im lặng: `loi` tăng thì dễ đọc thành "mạng chập tạm thời" trong khi thực tế
   kèo mới sinh ra đang bị xoá ngay. */
const logStat = {gui: 0, loi: 0, loiCuoi: '', cho: 0, mat: 0};

function tinhChan(P){
  /* bitmask 4 chốt chặn. 0 = kèo THẬT (qua hết), >0 = kèo bị chặn */
  return (Math.abs(P.S) < 25 ? 1 : 0)
       | (P.active < 2      ? 2 : 0)
       | (P.flowConflict    ? 4 : 0)
       | (P.satNoConfirm    ? 8 : 0);
}

function sinhKeo(E){
  const P = E.pred;
  if (!P.ready || P.warmLeft > 0) return;
  if (!P.sup || !P.res) return;                       /* không có tường thì không có kèo */
  /* Chưa có nến 48h thì cap rơi về hằng số 0.03 và frameH về 4 — đó là số BỊA,
     không phải số đo. Ghi vào DB là đầu độc mẫu ngay từ dòng đầu tiên. */
  if (!E.market.ranges) return;
  if (Math.abs(P.S) < NGUONG_GHI) return;
  const now = Date.now();
  if (E.keoMo && now < E.keoMo.han) return;           /* mỗi coin một kèo mở tại một thời điểm */

  const isLong = P.S > 0;
  const vao = isLong ? P.sup : P.res, chot = isLong ? P.res : P.sup;
  const cat = vao.p + (isLong ? -1 : 1) * HE_SO_CAT * P.cap * P.mid;
  const han = now + P.frameH * 3600e3;
  const tyLe = w => (w.mGop > 0 ? +(w.m / w.mGop).toFixed(4) : null);
  const sg = n => P.sigCo[n] ? +P.sig[n].toFixed(4) : null;

  const k = {
    uid: ulid(), ts: now, coin: E.sym, inst_id: E.sym + '-USDT-SWAP',
    ver: VER_TRONG_SO, loai: 'dir',
    dir: isLong ? 1 : -1,
    mid: sp(P.mid), bid: sp(P.bbOkx), ask: sp(P.baOkx),
    vao: sp(vao.p), chot: sp(chot.p), cat: sp(cat), han_ms: han,
    s: +P.S.toFixed(2),
    sig_f30: sg('f30'), sig_f5: sg('f5'), sig_bk: sg('bk'),
    sig_oi:  sg('oi'),  sig_fu: sg('fu'), sig_lq: sg('lq'),
    book_usd: Math.round(P.bookM), mua30_usd: Math.round(P.mua30), ban30_usd: Math.round(P.ban30),
    cap: +P.cap.toFixed(6), frame_h: P.frameH, ex_mask: P.exMask,
    vao_trust: vao.trust, vao_sv: 0, vao_pl: 0,
    vao_usd: Math.round(vao.m), vao_ty_le_okx: tyLe(vao),
    chot_trust: chot.trust, chot_usd: Math.round(chot.m), chot_ty_le_okx: tyLe(chot),
    tuoi_may: Math.round((now - E.engineStart) / 1000),
    tuoi_coin: P.tuoiCoin === null ? null : +P.tuoiCoin.toFixed(2),
    chan: tinhChan(P),
    ghim: scan.ghim.has(E.sym) ? 1 : 0
  };
  const w = E.wallBook[wallKey(isLong ? 'b' : 'a', vao.p)];
  if (w){ k.vao_sv = w.sv || 0; k.vao_pl = w.pl || 0; }

  E.keoMo = {uid: k.uid, han};
  hangDoi.push(k);
  /* Trần 500 chứ không 40: mỗi kèo ~1 KB, 500 kèo là 0,5 MB — không đáng gì so với
     mất mẫu. Trần 40 cũ chỉ đủ ~1 ngày, nên một lần token lệch là mọi kèo mới bị xoá
     ngay trong khi bot vẫn chạy và vẫn sinh kèo. Và mỗi lần ném PHẢI đếm. */
  if (hangDoi.length > 500){
    logStat.mat += hangDoi.length - 500;
    hangDoi.splice(0, hangDoi.length - 500);
  }
}

/* Gửi theo LÔ mỗi 10 giây. Fire-and-forget, timeout 5 giây — vòng phân tích
   tuyệt đối không được chờ mạng, một endpoint treo là app đứng hình. */
async function guiLog(){
  if (!API_LOG || dangGui || !hangDoi.length) return;
  dangGui = true;
  const lo = hangDoi.slice(0, 50);
  const huy = new AbortController();
  const hetGio = setTimeout(() => huy.abort(), 5000);
  try{
    const r = await fetch(API_LOG, {method: 'POST', signal: huy.signal,
      headers: {'Content-Type': 'application/json', 'X-Token': API_TOKEN},
      body: JSON.stringify(lo)});
    /* Xoá theo uid chứ không theo vị trí: nếu trong lúc chờ mạng mà hàng đợi bị
       cắt bớt ở đầu (khi vượt trần 40) thì splice(0, n) sẽ xoá nhầm kèo CHƯA gửi. */
    if (r.ok){
      const daGui = new Set(lo.map(x => x.uid));
      for (let i = hangDoi.length - 1; i >= 0; i--) if (daGui.has(hangDoi[i].uid)) hangDoi.splice(i, 1);
      logStat.gui += lo.length;
    }
    else { logStat.loi++; logStat.loiCuoi = 'HTTP ' + r.status; }  /* giữ lại, thử lại sau */
  }catch(e){ logStat.loi++; logStat.loiCuoi = e.name === 'AbortError' ? 'quá 5s' : 'mạng'; }
  finally{ clearTimeout(hetGio); dangGui = false; }
}
if (LA_BOT) setInterval(guiLog, 10000);

function render(){ renderLists(); }

/* ==================================================================
   MÁY QUÉT OKX — chọn ra SO_COIN coin nóng nhất rồi bật/tắt engine
   ================================================================== */
/* ghim = tập coin người dùng tự chọn, máy quét KHÔNG được phép gỡ.
   Thay cho nút TỰ ĐỘNG cũ: không còn trạng thái bật/tắt toàn cục nào có thể mắc kẹt,
   coin nào không ghim thì vẫn xoay vòng tự động như thường. */
const scan = {rows: [], hist: {}, ghim: new Set(),
  /* Ba trường giám sát máy quét — không có chúng thì "bot sống mà không theo dõi
     coin nào" là một trạng thái hoàn toàn im lặng. */
  lucQuet: 0, loi: 0, loiCuoi: ''};

async function pollScan(){
  try{
    const j = await fetch('https://www.okx.com/api/v5/market/tickers?instType=SWAP').then(r => r.json());
    if (!j.data) return;
    const now = Date.now();
    const rows = [];
    for (const t of j.data){
      if (!t.instId.endsWith('-USDT-SWAP')) continue;
      const last = parseFloat(t.last), open = parseFloat(t.open24h);
      const volUsd = parseFloat(t.volCcy24h) * last;
      if (!(last > 0) || !(open > 0) || !(volUsd > 200000)) continue;   /* bỏ coin chết thanh khoản */
      const sym = t.instId.slice(0, -10);
      const h = (scan.hist[sym] = scan.hist[sym] || []);
      h.push({t: now, p: last});
      while (h.length && now - h[0].t > 40 * 60e3) h.shift();
      let chg15 = null;
      for (let i = h.length - 1; i >= 0; i--){
        if (now - h[i].t >= 15 * 60e3){ chg15 = last / h[i].p - 1; break; }
      }
      rows.push({sym, last, chg24: last / open - 1, chg15, volUsd,
        heat: Math.abs(chg15 !== null ? chg15 : 0) * 6 + Math.abs(last / open - 1)});
    }
    scan.rows = rows;
    scan.lucQuet = Date.now();
    scan.loiCuoi = '';
    dongBoEngine();
    /* KHÔNG gọi renderScan() ở đây. pollScan chỉ chạy ở chế độ bot, mà bot không có
       DOM thật — dựng chuỗi HTML rồi ném vào bản giả lập là việc thừa mỗi 60 giây.
       Trang xem tự vẽ lại trong taiTrangThai(). */
  }catch(e){
    /* KHÔNG được nuốt im lặng. pollScan là thứ DUY NHẤT gọi dongBoEngine(), nên nếu
       lần quét đầu thất bại (hosting chặn gọi ra ngoài, OKX chặn IP datacenter, DNS
       chập lúc khởi động) thì bot sống, ảnh vẫn ghi mỗi 2 giây, nhưng KHÔNG có coin
       nào được theo dõi — vĩnh viễn. Dòng sức khoẻ khi đó in "0 coin · 0/0 sàn live"
       trông y như một dòng log bình thường, và trang xem hiện ảnh MỚI với hai bảng
       trống, không phân biệt được với "thị trường đang yên". Cron mỗi 5 phút cũng
       không cứu vì tiến trình không hề chết.
       (Đừng viết "sao-gạch-5" trong comment khối — nó đóng comment sớm.) */
    scan.loi++;
    scan.loiCuoi = String((e && e.message) || e);
  }
}

/* Đồng bộ tập engine với top coin nóng nhất.
   CÓ ĐỘ TRỄ (hysteresis): coin đang theo dõi chỉ bị gỡ khi rớt khỏi top SO_COIN+4,
   và mỗi vòng quét chỉ thay tối đa 2 coin. Không có hai chốt này thì tập coin
   nhảy loạn mỗi phút, và mỗi lần gỡ là mất sạch wallBook đã tích được. */
function dongBoEngine(){
  if (!scan.rows.length) return;
  const xepHang = [...scan.rows].sort((a, b) => b.heat - a.heat);
  const giuLai = new Set(xepHang.slice(0, SO_COIN + 4).map(r => r.sym));

  /* 1. gỡ coin đã rớt hẳn khỏi vùng đệm — TỐI ĐA 2 con mỗi vòng, vì mỗi lần gỡ
     là mất sạch wallBook đã tích được của coin đó. Coin GHIM miễn nhiễm. */
  let daGo = 0;
  for (const sym of Object.keys(engines)){
    if (daGo >= 2) break;
    if (scan.ghim.has(sym)) continue;
    if (!giuLai.has(sym)){ dungEngine(sym); daGo++; }
  }
  /* 2. lấp đầy tới SO_COIN bằng coin nóng nhất chưa được theo dõi (không giới hạn
     số lần thêm — lúc mới mở trang phải bật đủ ngay). Duyệt cả bảng xếp hạng chứ
     không chỉ top SO_COIN, vì các coin ghim đã chiếm sẵn một phần chỗ. */
  for (const r of xepHang){
    if (Object.keys(engines).length >= SO_COIN) break;
    if (!engines[r.sym]) batDauEngine(r.sym, Object.keys(engines).length);
  }
}

function renderScan(){
  const pct = x => (x >= 0 ? '+' : '') + (x * 100).toFixed(1) + '%';
  const volTxt = v => v >= 1e9 ? (v / 1e9).toFixed(1) + 'B' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : Math.round(v / 1e3) + 'K';
  const row = r => `<div class="scanRow${scan.ghim.has(r.sym) ? ' ghim' : engines[r.sym] ? ' theodoi' : ''}">
    <span class="s">${scan.ghim.has(r.sym) ? '📌' : engines[r.sym] ? '▶ ' : ''}${r.sym}</span>
    <span class="${r.chg24 >= 0 ? 'up' : 'dn'}">${pct(r.chg24)}</span>
    <span class="${(r.chg15 || 0) >= 0 ? 'up' : 'dn'}">${r.chg15 !== null ? "15': " + pct(r.chg15) : ''}</span>
    <span class="v">$${volTxt(r.volUsd)}</span></div>`;
  const ups = [...scan.rows].filter(r => r.chg24 > 0).sort((a, b) => b.chg24 - a.chg24).slice(0, 6);
  const dns = [...scan.rows].filter(r => r.chg24 < 0).sort((a, b) => a.chg24 - b.chg24).slice(0, 6);
  $('scanUp').innerHTML = '<h3>TOP TĂNG 24h</h3>' + ups.map(row).join('');
  $('scanDn').innerHTML = '<h3>TOP GIẢM 24h</h3>' + dns.map(row).join('');
  /* ĐÃ BỎ: bấm một dòng để ghim/bỏ ghim.
     renderScan() nay CHỈ chạy ở chế độ xem (bot không vẽ), mà chế độ xem thì
     không sở hữu tập engine — bấm vào chỉ sửa được bản sao trong RAM của trình
     duyệt rồi bị ghi đè sau 2 giây khi nạp ảnh mới. Giữ lại là một nút bấm nhìn
     như có tác dụng mà thật ra không, tệ hơn là không có nút.
     Ghim nay đặt bằng FILE: ~/bot/ghim.txt, mỗi dòng một mã coin, bot đọc lại mỗi
     30 giây và áp qua dongBoGhim(). Muốn có nút bấm trở lại thì cần một endpoint
     điều khiển có xác thực — mà làm vậy là phải đặt token vào trang công khai. */
}

/* ==================================================================
   KHỞI ĐỘNG — hai nhánh, không bao giờ chạy cả hai
   ================================================================== */
if (LA_BOT){
  setInterval(pollScan, 60000);
  pollScan();
} else {
  /* 2 giây/lần, đúng bằng nhịp bot ghi ảnh. Trước đây vẽ mỗi giây vì dữ liệu nằm
     ngay trong RAM; giờ dữ liệu chỉ mới mỗi 2 giây nên vẽ dày hơn là vẽ lại đúng
     thứ cũ — bằng thông tin mà nửa số việc. */
  taiTrangThai();
  setInterval(taiTrangThai, 2000);
}

/* Bot cần chạm vào trạng thái từ bên ngoài (ghi ảnh, nạp ghim.txt). Chỉ mở ở chế
   độ bot; trình duyệt không có __BOT__ nên không bao giờ sinh biến toàn cục này. */
if (LA_BOT) globalThis.__botAPI = {
  anhTrangThai, dongBoGhim, engines, scan, logStat,
  /* Ba biến của socket thanh lý là biến cục bộ trong khối script, không nằm trên
     object nào — nên phải có hàm này để bot.js đọc được mà giám sát. */
  trangThaiLq: () => ({lastMsg: lqLastMsg, lastData: lqLastData, loiCuoi: lqLoiCuoi})
};
</script>
